openapi: 3.1.0
info:
  title: ImmoService API
  version: 1.0.0
  license:
    name: Projet pédagogique — M2 IWOCS, Université Le Havre Normandie
    url: https://www-apps.univ-lehavre.fr/forge/ai223266/webservices_immoservice
  description: >-
    API REST du domaine immobilier : annonces, questions/réponses, comptes.


    - **Lecture publique** : les annonces publiées sont accessibles sans
    authentification.

    - **Écriture protégée** : JWT obligatoire (`Authorization: Bearer <jeton>`),
    obtenu via `POST /auth/login`.

    - **Erreurs** : toujours de la forme `{ error: { code, message, details }
    }`, avec un `code` stable.

    - **404 plutôt que 403** sur une ressource d'un autre utilisateur : on ne
    révèle pas son existence.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Jeton obtenu via POST /auth/login
  schemas:
    InscriptionInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          description: Nom affiché
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
          description: Email (unique, sert d'identifiant de connexion)
        password:
          type: string
          minLength: 8
          maxLength: 100
          description: Mot de passe (8 caractères minimum)
      required:
        - name
        - email
        - password
      description: "Tout autre champ (role, statutPro…) est ignoré : un compte créé
        ici est toujours USER."
      example:
        name: Marie Durand
        email: marie@exemple.fr
        password: motdepasse123
    ConnexionInput:
      type: object
      properties:
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        password:
          type: string
          minLength: 1
      required:
        - email
        - password
      example:
        email: agent1@immo.fr
        password: motdepasse123
    TypeBienInput:
      type: string
      enum:
        - VENTE
        - LOCATION
    StatutBienInput:
      type: string
      enum:
        - DISPONIBLE
        - LOUE
        - VENDU
    PhotoInput:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: URL de l'image
        alt:
          type: string
          minLength: 1
          maxLength: 200
          description: Texte alternatif (accessibilité)
      required:
        - url
        - alt
    CreerAnnonceInput:
      type: object
      properties:
        titre:
          type: string
          minLength: 5
          maxLength: 150
        description:
          type: string
          minLength: 10
          maxLength: 5000
        typeBien:
          $ref: "#/components/schemas/TypeBienInput"
        prix:
          type: number
          exclusiveMinimum: 0
          description: Prix de vente ou loyer mensuel, en euros
        surface:
          description: Surface en m²
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        ville:
          type: string
          minLength: 1
          maxLength: 100
        dateDisponibilite:
          description: Date de disponibilité au format AAAA-MM-JJ (ex. 2026-12-01)
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
        photos:
          default: []
          maxItems: 20
          type: array
          items:
            $ref: "#/components/schemas/PhotoInput"
      required:
        - titre
        - description
        - typeBien
        - prix
        - ville
        - dateDisponibilite
      description: L'annonce est créée en BROUILLON, avec l'agent connecté comme
        auteur. auteurId et statutPublication éventuellement envoyés sont
        ignorés.
      example:
        titre: Appartement 3 pièces – Perret, Le Havre
        description: Appartement lumineux de 68 m² proche de la plage.
        typeBien: VENTE
        prix: 163000
        surface: 68
        ville: Le Havre
        dateDisponibilite: 2026-12-01
        photos:
          - url: https://picsum.photos/seed/demo/640/480
            alt: Salon
    ModifierAnnonceInput:
      type: object
      properties:
        titre:
          type: string
          minLength: 5
          maxLength: 150
        description:
          type: string
          minLength: 10
          maxLength: 5000
        typeBien:
          $ref: "#/components/schemas/TypeBienInput"
        prix:
          type: number
          exclusiveMinimum: 0
          description: Prix de vente ou loyer mensuel, en euros
        surface:
          description: Surface en m²
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        ville:
          type: string
          minLength: 1
          maxLength: 100
        dateDisponibilite:
          description: Date de disponibilité au format AAAA-MM-JJ (ex. 2026-12-01)
          type: string
          format: date
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
        statutBien:
          $ref: "#/components/schemas/StatutBienInput"
      description: "Modification partielle : seuls les champs envoyés changent (au
        moins un)."
      example:
        prix: 155000
    NouvelleQuestionInput:
      type: object
      properties:
        contenu:
          type: string
          minLength: 5
          maxLength: 1000
      required:
        - contenu
      example:
        contenu: Les animaux sont-ils acceptés ?
    NouvelleReponseInput:
      type: object
      properties:
        contenu:
          type: string
          minLength: 2
          maxLength: 2000
      required:
        - contenu
      example:
        contenu: Oui, les animaux sont acceptés.
    Erreur:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - VALIDATION_FAILED
                - BAD_REQUEST
                - UNAUTHENTICATED
                - INVALID_CREDENTIALS
                - FORBIDDEN
                - NOT_FOUND
                - EMAIL_ALREADY_USED
                - QUESTION_ALREADY_ANSWERED
                - CONFLICT
                - INTERNAL_ERROR
              description: "Code stable, lisible par une machine. Fait partie du contrat : ne
                change jamais."
            message:
              type: string
              description: Message destiné à un humain (peut évoluer)
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    description: Champ concerné (ex. prix, limit)
                  message:
                    type: string
                    description: Problème sur ce champ
                required:
                  - field
                  - message
                additionalProperties: false
              description: Détails par champ (vide si non pertinent)
          required:
            - code
            - message
            - details
          additionalProperties: false
      required:
        - error
      additionalProperties: false
      description: Forme unique de toutes les erreurs de l'API
      example:
        error:
          code: VALIDATION_FAILED
          message: La requête est invalide
          details:
            - field: prix
              message: "Too small: expected number to be >0"
    MetaPagination:
      type: object
      properties:
        page:
          type: number
          description: Page courante
        limit:
          type: number
          description: Taille de page
        total:
          type: number
          description: Nombre total d'éléments correspondant aux filtres
        pages:
          type: number
          description: Nombre total de pages
      required:
        - page
        - limit
        - total
        - pages
      additionalProperties: false
      description: Métadonnées de pagination
    AuteurPublic:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
      additionalProperties: false
      description: Auteur visible publiquement (ni email ni mot de passe)
    Profil:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
            - USER
            - AGENT
            - ADMIN
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - role
        - createdAt
      additionalProperties: false
      description: Profil de l'utilisateur (jamais le mot de passe ni son hash)
    Jeton:
      type: object
      properties:
        token:
          type: string
          description: "JWT signé, à envoyer dans l'en-tête Authorization: Bearer <token>"
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: string
          description: Durée de validité (ex. 1h)
      required:
        - token
        - tokenType
        - expiresIn
      additionalProperties: false
    TypeBien:
      type: string
      enum:
        - VENTE
        - LOCATION
    StatutBien:
      type: string
      enum:
        - DISPONIBLE
        - LOUE
        - VENDU
    StatutPublication:
      type: string
      enum:
        - BROUILLON
        - PUBLIEE
      description: Modifié uniquement via /annonces/{id}/publication
    Annonce:
      type: object
      properties:
        id:
          type: number
        titre:
          type: string
        description:
          type: string
        typeBien:
          $ref: "#/components/schemas/TypeBien"
        statutPublication:
          $ref: "#/components/schemas/StatutPublication"
        statutBien:
          $ref: "#/components/schemas/StatutBien"
        prix:
          type: number
        surface:
          type:
            - number
            - "null"
        ville:
          type: string
        dateDisponibilite:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        auteur:
          $ref: "#/components/schemas/AuteurPublic"
        photos:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                format: uri
                description: URL de l'image
              alt:
                type: string
                minLength: 1
                maxLength: 200
                description: Texte alternatif (accessibilité)
              id:
                type: number
            required:
              - url
              - alt
              - id
            additionalProperties: false
      required:
        - id
        - titre
        - description
        - typeBien
        - statutPublication
        - statutBien
        - prix
        - surface
        - ville
        - dateDisponibilite
        - createdAt
        - updatedAt
        - auteur
        - photos
      additionalProperties: false
    PageAnnonces:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Annonce"
        meta:
          $ref: "#/components/schemas/MetaPagination"
      required:
        - data
        - meta
      additionalProperties: false
    Publication:
      type: object
      properties:
        id:
          type: number
        statutPublication:
          $ref: "#/components/schemas/StatutPublication"
      required:
        - id
        - statutPublication
      additionalProperties: false
    Reponse:
      type: object
      properties:
        id:
          type: number
        contenu:
          type: string
        createdAt:
          type: string
          format: date-time
        auteur:
          $ref: "#/components/schemas/AuteurPublic"
      required:
        - id
        - contenu
        - createdAt
        - auteur
      additionalProperties: false
    Question:
      type: object
      properties:
        id:
          type: number
        annonceId:
          type: number
        contenu:
          type: string
        createdAt:
          type: string
          format: date-time
        auteur:
          $ref: "#/components/schemas/AuteurPublic"
        reponse:
          anyOf:
            - $ref: "#/components/schemas/Reponse"
            - type: "null"
          description: null tant que l'agent n'a pas répondu
      required:
        - id
        - annonceId
        - contenu
        - createdAt
        - auteur
        - reponse
      additionalProperties: false
    PageQuestions:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Question"
        meta:
          $ref: "#/components/schemas/MetaPagination"
      required:
        - data
        - meta
      additionalProperties: false
paths:
  /auth/register:
    post:
      operationId: inscrire
      summary: Créer un compte (toujours avec le rôle USER)
      tags:
        - auth
      description: Un champ role envoyé par le client est ignoré. 409 si l'email est
        déjà utilisé.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InscriptionInput"
      security: &a1 []
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profil"
        "400":
          description: Requête invalide (body, query ou path) — VALIDATION_FAILED ou
            BAD_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "409":
          description: Conflit avec l'état actuel — EMAIL_ALREADY_USED,
            QUESTION_ALREADY_ANSWERED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
  /auth/login:
    post:
      operationId: connecter
      summary: S'authentifier et obtenir un JWT
      tags:
        - auth
      description: 401 avec le même message que l'email ou le mot de passe soit faux.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnexionInput"
      security: *a1
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jeton"
        "400":
          description: Requête invalide (body, query ou path) — VALIDATION_FAILED ou
            BAD_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "401":
          description: Email ou mot de passe incorrect — INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
  /me:
    get:
      operationId: monProfil
      summary: Mon profil
      tags:
        - auth
      security: &a2
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profil"
        "401":
          description: Jeton absent, invalide ou expiré — UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
  /annonces:
    get:
      operationId: listerAnnonces
      summary: Liste paginée et filtrée des annonces publiées
      tags:
        - annonces
      description: Public. Ne renvoie jamais de brouillon, quel que soit l'appelant
        (réponse identique pour tous).
      parameters:
        - schema:
            default: 1
            type: integer
            minimum: 1
            maximum: 9007199254740991
          in: query
          name: page
          required: false
          description: Numéro de page (à partir de 1)
        - schema:
            default: 20
            type: integer
            minimum: 1
            maximum: 100
          in: query
          name: limit
          required: false
          description: Nombre d'éléments par page (100 maximum)
        - schema:
            type: string
            minLength: 1
            maxLength: 100
          in: query
          name: ville
          required: false
          description: Ville exacte (insensible à la casse)
        - schema:
            $ref: "#/components/schemas/TypeBienInput"
          in: query
          name: type
          required: false
        - schema:
            type: number
            exclusiveMinimum: 0
          in: query
          name: prixMax
          required: false
          description: Prix maximum (inclus), en euros
      security: *a1
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageAnnonces"
        "400":
          description: Requête invalide (body, query ou path) — VALIDATION_FAILED ou
            BAD_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
    post:
      operationId: creerAnnonce
      summary: Créer une annonce (brouillon)
      tags:
        - annonces
      description: "AGENT ou ADMIN. Réponse 201 avec l'en-tête Location: /annonces/{id}."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreerAnnonceInput"
      security: *a2
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Annonce"
        "400":
          description: Requête invalide (body, query ou path) — VALIDATION_FAILED ou
            BAD_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "401":
          description: Jeton absent, invalide ou expiré — UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "403":
          description: Le rôle ne permet pas l'opération  ou agent non validé — FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
  /annonces/{id}:
    get:
      operationId: lireAnnonce
      summary: Détail d'une annonce
      tags:
        - annonces
      description: "Public pour une annonce publiée. Un brouillon n'est visible que
        par son auteur et les admins : pour tout autre appelant, 404."
      parameters:
        - schema:
            type: integer
            exclusiveMinimum: 0
            maximum: 9007199254740991
          in: path
          name: id
          required: true
          description: Identifiant numérique de la ressource
      security: &a3
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Annonce"
        "400":
          description: Requête invalide (body, query ou path) — VALIDATION_FAILED ou
            BAD_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "401":
          description: Jeton absent, invalide ou expiré — UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "404":
          description: Ressource inexistante OU appartenant à un autre utilisateur
            (indiscernables volontairement) — NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
    patch:
      operationId: modifierAnnonce
      summary: Modifier une annonce (champs envoyés uniquement)
      tags:
        - annonces
      description: Propriétaire ou ADMIN. La publication ne se modifie pas ici, mais
        via /annonces/{id}/publication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifierAnnonceInput"
      parameters:
        - schema:
            type: integer
            exclusiveMinimum: 0
            maximum: 9007199254740991
          in: path
          name: id
          required: true
          description: Identifiant numérique de la ressource
      security: *a2
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Annonce"
        "400":
          description: Requête invalide (body, query ou path) — VALIDATION_FAILED ou
            BAD_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "401":
          description: Jeton absent, invalide ou expiré — UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "403":
          description: Le rôle ne permet pas l'opération  ou agent non validé — FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "404":
          description: Ressource inexistante OU appartenant à un autre utilisateur
            (indiscernables volontairement) — NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
    delete:
      operationId: supprimerAnnonce
      summary: Supprimer une annonce
      tags:
        - annonces
      description: Propriétaire ou ADMIN. 404 si l'annonce n'existe pas ou appartient
        à un autre agent.
      parameters:
        - schema:
            type: integer
            exclusiveMinimum: 0
            maximum: 9007199254740991
          in: path
          name: id
          required: true
          description: Identifiant numérique de la ressource
      security: *a2
      responses:
        "204":
          description: Annonce supprimée
        "400":
          description: Requête invalide (body, query ou path) — VALIDATION_FAILED ou
            BAD_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "401":
          description: Jeton absent, invalide ou expiré — UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "403":
          description: Le rôle ne permet pas l'opération  ou agent non validé — FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "404":
          description: Ressource inexistante OU appartenant à un autre utilisateur
            (indiscernables volontairement) — NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
  /me/annonces:
    get:
      operationId: mesAnnonces
      summary: Mes annonces (brouillons compris)
      tags:
        - annonces
      parameters:
        - schema:
            default: 1
            type: integer
            minimum: 1
            maximum: 9007199254740991
          in: query
          name: page
          required: false
          description: Numéro de page (à partir de 1)
        - schema:
            default: 20
            type: integer
            minimum: 1
            maximum: 100
          in: query
          name: limit
          required: false
          description: Nombre d'éléments par page (100 maximum)
      security: *a2
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageAnnonces"
        "400":
          description: Requête invalide (body, query ou path) — VALIDATION_FAILED ou
            BAD_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "401":
          description: Jeton absent, invalide ou expiré — UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
        "403":
          description: Le rôle ne permet pas l'opération  ou agent non validé — FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erreur"
  /annonces/{id}/publication:
    put:
      operationId: publierAnnonce
      summary: Publier une annonce
      tags:
        - annonces
      description: "Idempotent : publier une annonce déjà publiée renvoie le même résultat."
      parameters:
        - schema:
            type: integer
            exclusiveMinimum: 0
